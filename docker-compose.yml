# Infrastructure du pipeline : bus de messages et base de données.
#
# Spark n'apparaît pas ici : le job `spark-streaming.py` tourne en `local[*]`
# via PySpark, sur la machine hôte. Voir « Limites connues » dans le README.
#
# Les mots de passe sont lus depuis `.env` (voir `.env.example`).

services:
  # Zookeeper, avec healthcheck : le broker Kafka ne démarre qu'une fois
  # Zookeeper déclaré sain, ce qui évite les échecs de démarrage en cascade.
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    hostname: zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ['CMD', 'bash', '-c', "echo 'ruok' | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Broker Kafka. Deux écouteurs sont déclarés : `broker:29092` pour les
  # échanges entre conteneurs, `localhost:9092` pour les scripts Python
  # lancés depuis la machine hôte — c'est celui qu'utilise le pipeline.
  #
  # `cp-kafka` et non `cp-server` : l'image entreprise pèse le double (1,7 Go
  # contre 845 Mo) pour des fonctions que ce projet n'utilise pas.
  broker:
    image: confluentinc/cp-kafka:7.4.0
    hostname: broker
    container_name: broker
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "9101:9101"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
    healthcheck:
      test: [ "CMD", "bash", "-c", 'nc -z localhost 9092' ]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:14.0
    container_name: postgres
    # PostgreSQL écoute sur 5432 dans le conteneur. On l'expose sur 5433 côté
    # hôte pour ne pas entrer en conflit avec une installation locale.
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-voting}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-postgres}", "-d", "${POSTGRES_DB:-voting}"]
      interval: 10s
      timeout: 5s
      retries: 5
